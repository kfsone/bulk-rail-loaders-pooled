[mod-setting-name]
mbrlp-silo-capacity=Silo capacity (slots per silo)
mbrlp-max-silos=Maximum silos per station

[mod-setting-description]
mbrlp-silo-capacity=Each silo adds this many inventory slots to the station's shared pool. Default is 96.
mbrlp-max-silos=Upper bound on silos per station; sets the size of the hidden pool inventory. Default is 16.

[entity-name]
mbrlp-silo=Bulk loader silo
mbrlp-pool=Bulk loader pool

[entity-description]
mbrlp-silo=A window onto the station's shared cargo pool. All silos at a station show and share the same inventory, so wagons can never go out of balance. Wire exactly one silo to read the station total.

[item-name]
mbrlp-silo=Bulk loader silo
